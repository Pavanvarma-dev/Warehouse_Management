_schema-version: 3.3.0
ID: warehouse-management
version: 1.0.0
description: "Welcome to your new CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: warehouse-management-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: warehouse-management-auth
      - name: warehouse-management-db

    name: warehouse-management
    type: nodejs
    path: .deploy/app-router
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      disk-quota: 256M
      memory: 256M
    build-parameters:
      bulder: npm-ci
    provides:
      - name: app-router
        properties: 
          app-url: ${default-url}
    requires:
    
      - name: warehouse-management-auth
      - name: warehouse-management-db
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true

    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: warehouse-management-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: warehouse-management-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'warehouse_operator (warehouse-management ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.warehouse_operator'
          - name: 'warehouse_manager (warehouse-management ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.warehouse_manager'
          - name: 'admin (warehouse-management ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.admin'
    requires:
      - name: app-api
